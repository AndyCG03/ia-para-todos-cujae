<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Para Todos - CUJAE</title>
  <link rel="icon" type="image/png" href="/assets/cujae.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .fade-section {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .fade-section.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .hero {
      min-height: calc(100vh - 64px);
      display: grid;
      align-items: center;
      background:
        linear-gradient(90deg, rgba(15,111,58,0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(15,111,58,0.06) 1px, transparent 1px),
        linear-gradient(180deg, #F8FAF8 0%, #EEF3EF 100%);
      background-size: 44px 44px, 44px 44px, auto;
      padding: 3rem 1.5rem;
      overflow: hidden;
    }
    .hero-inner {
      width: min(1120px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 0.85fr);
      gap: 2.5rem;
      align-items: center;
    }
    .hero-logo { height: 96px; width: auto; object-fit: contain; margin-bottom: 1.5rem; }
    .hero-title {
      font-family: var(--font-main);
      font-size: clamp(2.1rem, 4.35vw, 4.25rem);
      font-weight: 900;
      line-height: 1.03;
      margin-bottom: 1rem;
      max-width: 700px;
    }
    .hero-title span { color: var(--azul); }
    .hero-subtitle {
      font-size: 1.18rem;
      color: var(--gris-oscuro);
      max-width: 620px;
      margin-bottom: 2rem;
      font-weight: 500;
    }
    .hero-actions { display: flex; gap: 0.8rem; flex-wrap: wrap; }
    .hero-mascot-wrap {
      justify-self: center;
      position: relative;
    }
    .hero-mascot {
      width: min(430px, 86vw);
      border-radius: 0;
      box-shadow: none;
      display: block;
    }
    .home-nav {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      margin-left: 0;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    .home-nav a {
      color: var(--gris-oscuro);
      text-decoration: none;
      font-weight: 800;
      font-size: 0.88rem;
      padding: 0.45rem 0.7rem;
      border-radius: 999px;
      transition: background 0.16s ease, color 0.16s ease;
      white-space: nowrap;
    }
    .home-nav a:hover {
      background: var(--azul-pale);
      color: var(--azul);
    }
    .nav-toggle {
      display: none;
    }
    .section {
      padding: 4.5rem 1.5rem;
      background: white;
    }
    .section.alt { background: var(--gris-claro); }
    .section-inner { width: min(1120px, 100%); margin: 0 auto; }
    .section-kicker {
      color: var(--azul);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.5rem;
    }
    .section h2 {
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      margin-bottom: 0.7rem;
      max-width: 760px;
    }
    .section-lead {
      color: var(--gris-oscuro);
      max-width: 760px;
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    .game-card {
      background: #F8FAF8;
      border: 1px solid rgba(23,33,28,0.10);
      border-left: 3px solid var(--azul);
      border-radius: var(--radius-lg);
      padding: 1.35rem;
      min-height: 210px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .game-card:hover {
      transform: translateY(-6px);
      background: white;
      border-color: rgba(15,111,58,0.28);
      border-left-color: var(--azul);
      box-shadow: var(--shadow-md);
    }
    .game-card:hover .game-icon { transform: scale(1.08); filter: grayscale(0.25); }
    .game-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.8rem;
    }
    .game-icon { font-size: 1.85rem; filter: grayscale(0.65); transition: transform 0.2s ease, filter 0.2s ease; }
    .game-tag {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--azul);
      background: var(--azul-pale);
      border-radius: 99px;
      padding: 0.2rem 0.55rem;
      white-space: nowrap;
    }
    .game-card h3 { margin-bottom: 0.45rem; }
    .game-card p { color: var(--gris-oscuro); font-size: 0.92rem; margin-bottom: 0; }
    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    .detail-card {
      background: white;
      border: 1px solid rgba(23,33,28,0.10);
      border-radius: var(--radius-lg);
      padding: 1.4rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .detail-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: rgba(15,111,58,0.24);
    }
    .detail-card h3 { margin-bottom: 0.5rem; color: var(--azul); }
    .detail-card p { color: var(--gris-oscuro); margin-bottom: 0; }
    .rooms-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 2rem;
      align-items: center;
    }
    .steps {
      display: grid;
      gap: 0.8rem;
      counter-reset: steps;
    }
    .step {
      counter-increment: steps;
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 1rem;
      align-items: start;
      background: white;
      border: 1px solid rgba(23,33,28,0.10);
      border-radius: var(--radius-lg);
      padding: 1rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .step:hover {
      transform: translateX(4px);
      box-shadow: var(--shadow-sm);
      border-color: rgba(15,111,58,0.24);
    }
    .step::before {
      content: counter(steps);
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--azul);
      color: white;
      font-weight: 900;
    }
    .step strong { display: block; margin-bottom: 0.2rem; }
    .step span { color: var(--gris-oscuro); }
    .rooms-mascot {
      width: 100%;
      border-radius: 20px;
      box-shadow: var(--shadow-md);
    }
    .footer {
      background: #17211C;
      color: rgba(255,255,255,0.68);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.88rem;
    }
    .footer strong { color: white; }
    .quick-actions {
      position: fixed;
      right: 1.35rem;
      bottom: 1.35rem;
      z-index: 250;
      display: grid;
      justify-items: end;
      gap: 0.75rem;
    }
    .quick-panel {
      display: none;
      grid-template-columns: 1fr;
      gap: 0.5rem;
      background: white;
      border: 1px solid rgba(23,33,28,0.12);
      border-radius: var(--radius-lg);
      padding: 0.75rem;
      box-shadow: var(--shadow-lg);
      width: 210px;
    }
    .quick-actions.open .quick-panel { display: grid; }
    .quick-panel .btn { width: 100%; justify-content: center; }
    .quick-main {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      background: var(--azul);
      color: white;
      box-shadow: var(--shadow-lg);
      cursor: pointer;
      font-size: 1.45rem;
      font-weight: 900;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }
    .quick-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 42px rgba(15,111,58,0.24);
    }
    @media(max-width: 860px) {
      .hero-inner,
      .rooms-layout { grid-template-columns: 1fr; }
      .hero-mascot-wrap { order: -1; }
      .games-grid,
      .details-grid { grid-template-columns: 1fr; }
      .hero { padding-top: 2rem; }
    }
    @media(max-width: 720px) {
      .header { height: auto; min-height: 64px; flex-wrap: wrap; padding: 0.7rem 1rem; gap: 0.65rem; }
      .nav-toggle {
        display: inline-flex;
        margin-left: auto;
      }
      .home-nav {
        display: none;
        position: absolute;
        top: calc(100% + 0.35rem);
        left: 1rem;
        right: 1rem;
        transform: none;
        width: auto;
        flex-direction: column;
        align-items: stretch;
        background: white;
        border: 1px solid rgba(23,33,28,0.12);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        padding: 0.5rem;
      }
      .home-nav.open { display: flex; }
      .home-nav a { padding: 0.7rem 0.8rem; }
      .hero { min-height: auto; padding: 2rem 1rem 3rem; }
      .hero-actions .btn { width: 100%; }
      .hero-mascot { width: min(360px, 88vw); margin: 0 auto; }
      .quick-actions { right: 1rem; bottom: 1rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" aria-label="Ir al inicio"><img src="/assets/cujae.png" alt="CUJAE" class="header-logo"></a>
    <div>
      <div class="header-title">IA Para Todos</div>
      <div class="header-subtitle" data-i18n="header.subtitle"></div>
    </div>
    <button class="btn btn-ghost btn-sm nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="home-nav" data-i18n="nav.sections"></button>
    <nav class="home-nav" id="home-nav" aria-label="Secciones de la pagina">
      <a href="#inicio" data-i18n="nav.home"></a>
      <a href="#juegos" data-i18n="nav.games"></a>
      <a href="#funciona" data-i18n="nav.how"></a>
      <a href="#salas" data-i18n="nav.rooms"></a>
    </nav>
    <div class="header-spacer"></div>
    <div id="lang-switcher-container"></div>
    <span class="header-badge" data-i18n="header.badge"></span>
  </header>

  <section class="hero fade-section" id="inicio">
    <div class="hero-inner">
      <div>
        <h1 class="hero-title" data-i18n="hero.title" data-i18n-html="true"></h1>
        <p class="hero-subtitle" data-i18n="hero.subtitle"></p>
        <div class="hero-actions">
          <a href="/docente" class="btn btn-primary btn-lg" data-i18n="hero.create"></a>
          <a href="/jugar" class="btn btn-ghost btn-lg" data-i18n="hero.join"></a>
        </div>
      </div>
      <div class="hero-mascot-wrap">
        <img src="/assets/mascota.png" alt="Mascota de IA Para Todos" class="hero-mascot">
      </div>
    </div>
  </section>

  <section class="section fade-section" id="juegos">
    <div class="section-inner">
      <div class="section-kicker" data-i18n="games.kicker"></div>
      <h2 data-i18n="games.title"></h2>
      <p class="section-lead" data-i18n="games.lead"></p>
      <div class="games-grid">
        <article class="game-card">
          <div class="game-top"><span class="game-icon">🧠</span><span class="game-tag" data-i18n="games.offline"></span></div>
          <h3 data-i18n="games.trivia.name"></h3>
          <p data-i18n="games.trivia.desc"></p>
        </article>
        <article class="game-card">
          <div class="game-top"><span class="game-icon">🤖</span><span class="game-tag" data-i18n="games.offline"></span></div>
          <h3 data-i18n="games.turing.name"></h3>
          <p data-i18n="games.turing.desc"></p>
        </article>
        <article class="game-card">
          <div class="game-top"><span class="game-icon">⚖️</span><span class="game-tag" data-i18n="games.offline"></span></div>
          <h3 data-i18n="games.ethics.name"></h3>
          <p data-i18n="games.ethics.desc"></p>
        </article>
        <article class="game-card">
          <div class="game-top"><span class="game-icon">🕵️</span><span class="game-tag" data-i18n="games.offline"></span></div>
          <h3 data-i18n="games.fakenews.name"></h3>
          <p data-i18n="games.fakenews.desc"></p>
        </article>
        <article class="game-card">
          <div class="game-top"><span class="game-icon">🧐</span><span class="game-tag" data-i18n="games.offline"></span></div>
          <h3 data-i18n="games.hallucination.name"></h3>
          <p data-i18n="games.hallucination.desc"></p>
        </article>
        <article class="game-card">
          <div class="game-top"><span class="game-icon">✍️</span><span class="game-tag" data-i18n="games.api"></span></div>
          <h3 data-i18n="games.completeprompt.name"></h3>
          <p data-i18n="games.completeprompt.desc"></p>
        </article>
        <article class="game-card">
          <div class="game-top"><span class="game-icon">🗣️</span><span class="game-tag" data-i18n="games.api"></span></div>
          <h3 data-i18n="games.debate.name"></h3>
          <p data-i18n="games.debate.desc"></p>
        </article>
      </div>
    </div>
  </section>

  <section class="section alt fade-section" id="funciona">
    <div class="section-inner">
      <div class="section-kicker" data-i18n="how.kicker"></div>
      <h2 data-i18n="how.title"></h2>
      <p class="section-lead" data-i18n="how.lead"></p>
      <div class="details-grid">
        <article class="detail-card">
          <h3 data-i18n="how.quick.title"></h3>
          <p data-i18n="how.quick.desc"></p>
        </article>
        <article class="detail-card">
          <h3 data-i18n="how.texts.title"></h3>
          <p data-i18n="how.texts.desc"></p>
        </article>
        <article class="detail-card">
          <h3 data-i18n="how.prompts.title"></h3>
          <p data-i18n="how.prompts.desc"></p>
        </article>
        <article class="detail-card">
          <h3 data-i18n="how.debate.title"></h3>
          <p data-i18n="how.debate.desc"></p>
        </article>
      </div>
    </div>
  </section>

  <section class="section fade-section" id="salas">
    <div class="section-inner rooms-layout">
      <div>
        <div class="section-kicker" data-i18n="rooms.kicker"></div>
        <h2 data-i18n="rooms.title"></h2>
        <p class="section-lead" data-i18n="rooms.lead"></p>
        <div class="steps">
          <div class="step"><div><strong data-i18n="rooms.step1.title"></strong><span data-i18n="rooms.step1.desc"></span></div></div>
          <div class="step"><div><strong data-i18n="rooms.step2.title"></strong><span data-i18n="rooms.step2.desc"></span></div></div>
          <div class="step"><div><strong data-i18n="rooms.step3.title"></strong><span data-i18n="rooms.step3.desc"></span></div></div>
          <div class="step"><div><strong data-i18n="rooms.step4.title"></strong><span data-i18n="rooms.step4.desc"></span></div></div>
        </div>
      </div>
      <img src="/assets/mascota.png" alt="Mascota acompanando las salas" class="rooms-mascot">
    </div>
  </section>

  <footer class="footer">
    <p data-i18n="footer.text" data-i18n-html="true"></p>
  </footer>

  <div class="quick-actions" id="quick-actions">
    <div class="quick-panel" aria-label="Acciones rapidas">
      <a href="/docente" class="btn btn-primary" data-i18n="quick.create"></a>
      <a href="/jugar" class="btn btn-ghost" data-i18n="quick.join"></a>
    </div>
    <button class="quick-main" id="quick-main" aria-label="Abrir acciones rápidas" aria-expanded="false">+</button>
  </div>

  <script src="/js/i18n.js"></script>
  <script>
    // Init i18n
    I18N.injectSwitcher(document.getElementById('lang-switcher-container'));
    I18N.applyToDOM();

    const navToggle = document.getElementById('nav-toggle');
    const homeNav = document.querySelector('.home-nav');
    if (navToggle && homeNav) {
      navToggle.addEventListener('click', () => {
        const isOpen = homeNav.classList.toggle('open');
        navToggle.setAttribute('aria-expanded', String(isOpen));
      });
      homeNav.querySelectorAll('a').forEach((link) => {
        link.addEventListener('click', () => {
          homeNav.classList.remove('open');
          navToggle.setAttribute('aria-expanded', 'false');
        });
      });
    }

    const quickActions = document.getElementById('quick-actions');
    const quickMain = document.getElementById('quick-main');
    quickMain.addEventListener('click', () => {
      const isOpen = quickActions.classList.toggle('open');
      quickMain.setAttribute('aria-expanded', String(isOpen));
      quickMain.textContent = isOpen ? '×' : '+';
    });

    const fadeSections = document.querySelectorAll('.fade-section');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -8% 0px' });
    fadeSections.forEach((section) => observer.observe(section));
  </script>
</body>
</html>
